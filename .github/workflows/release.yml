name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Go (CGO_ENABLED=0)
        working-directory: go
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: go build -trimpath -ldflags "-s -w" -o system-monitor.exe ./cmd/monitor
      - name: Publish lhm-dump
        run: dotnet publish go/lhm-dump/lhm-dump.csproj -c Release -o build/lhm-dump
      - name: Zip portable
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $zip = "dist/system-monitor-${{ github.ref_name }}-windows-amd64.zip"
          Compress-Archive -Path go/system-monitor.exe, build/lhm-dump/*, sql/schema.sql, config.toml.example, README.md -DestinationPath $zip -Force
          Get-ChildItem dist
      - name: Build Inno Setup installer
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/system-monitor.iss
          Get-ChildItem dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.exe
          generate_release_notes: true
