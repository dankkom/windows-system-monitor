name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Go vet
        working-directory: go
        run: go vet ./...
      - name: Go build
        working-directory: go
        run: go build -o system-monitor.exe ./cmd/monitor
      - name: Go test
        working-directory: go
        run: go test ./... -count=1
      - name: Dotnet publish lhm-dump
        run: dotnet publish go/lhm-dump/lhm-dump.csproj -c Release -o build/lhm-dump
      - name: Verify --init dry (no DB) help
        working-directory: go
        run: .\system-monitor.exe --help
      - name: Upload artifact (binary + helper)
        uses: actions/upload-artifact@v4
        with:
          name: system-monitor-windows-amd64
          path: |
            go/system-monitor.exe
            build/lhm-dump/
            sql/schema.sql
